  function vt(key) { return (V_I18N[lang] && V_I18N[lang][key]) || V_I18N.es[key] || key; }

  function decodePayload(encoded) {
    try {
      let base64 = encoded.replace(/-/g, '+').replace(/_/g, '/');
      while (base64.length % 4) base64 += '=';
      return JSON.parse(decodeURIComponent(escape(atob(base64))));
    } catch (e) {
      return null;
    }
  }

  // (same field subset, same key order) for a recomputed hash to ever

      nameA: payload.nameA, nameB: payload.nameB,
      date: payload.date,
      clauseTitles: payload.clauseTitles,
      sigA: payload.sigA, sigB: payload.sigB,
      optional: payload.optional,
    });
  }

    const enc = new TextEncoder().encode(str);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  }

  function optionalList(optional) {
    if (!optional) return '—';
    const on = Object.keys(optional).filter(k => optional[k]);
    return on.length ? on.join(', ') : '—';
  }

  function setStatus(state, titleKey, descKey) {
    const box = document.getElementById('v-status');
    const icons = {
      match: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/></svg>',
      mismatch: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>',
      empty: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>',
    };
    box.className = 'verify-status-card mt-6 state-' + state;
    document.getElementById('v-status-icon').innerHTML = icons[state];
    document.getElementById('v-status-title').textContent = vt(titleKey);
    document.getElementById('v-status-desc').textContent = vt(descKey);
  }

  function renderDetails(payload, hash) {
    const box = document.getElementById('v-details-box');
    const dl = document.getElementById('v-details');
    const rows = [
      [vt('field_ref'), payload.ref || '—'],
      [vt('field_type'), docTypeLabel(payload.docType)],
      [vt('field_parties'), [payload.nameA, payload.nameB].filter(Boolean).join(' / ') || '—'],
      [vt('field_date'), payload.date || '—'],
      [vt('field_clauses'), String((payload.clauseTitles || []).length)],
      [vt('field_signatures'), `${payload.sigA ? vt('sig_yes') : vt('sig_no')} / ${payload.sigB ? vt('sig_yes') : vt('sig_no')}`],
      [vt('field_hash'), hash],
    ];
    dl.innerHTML = rows.map(([label, value]) => `<dt>${escapeHtml(label)}</dt><dd${label === vt('field_hash') ? ' class="verify-hash-value"' : ''}>${escapeHtml(String(value))}</dd>`).join('');
    box.classList.remove('hidden');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function run() {
    document.documentElement.lang = lang;
    document.getElementById('v-title').textContent = vt('page_title');
    document.title = vt('page_title');
    document.getElementById('v-heading').textContent = vt('heading');
    document.getElementById('v-subtitle').textContent = vt('subtitle');
    document.getElementById('v-disclaimer').textContent = vt('disclaimer');
    document.getElementById('v-back').textContent = vt('back_link');

    const encoded = params.get('d');
    const expectedHash = params.get('h');

    if (!encoded || !expectedHash) {
      setStatus('empty', 'status_empty', 'status_empty_desc');
      return;
    }

    const payload = decodePayload(encoded);
    if (!payload) {
      setStatus('empty', 'status_empty', 'status_empty_desc');
      return;
    }

    const recomputed = await sha256Hex(canonicalHashPayload(payload));
    if (recomputed === expectedHash) {
      setStatus('match', 'status_match', 'status_match_desc');
    } else {
      setStatus('mismatch', 'status_mismatch', 'status_mismatch_desc');
    }
    renderDetails(payload, expectedHash);
  }

  run();
})();
</script>
</body>
</html>
